<h1 class="sm-h1" style="margin:0 0 16px; font-size:22px; line-height:1.3; font-weight:650; letter-spacing:-0.02em; color:#111827;">
  Welcome aboard, {{firstName}}
</h1>
<p style="margin:0 0 22px;">
  {{intro}}
</p>
{{{highlights}}}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0;">
  <tr>
    <td style="border-radius:8px; background-color:#4f46e5;">
      <a href="{{actionUrl}}" style="display:inline-block; padding:12px 22px; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none;">{{actionLabel}}</a>
    </td>
  </tr>
</table>
<p style="margin:0 0 8px; font-size:13px; color:#6b7280;">
  If the button does not work, paste this link into your browser:
</p>
<p style="margin:0; font-size:13px; word-break:break-all;">
  <a href="{{actionUrl}}" style="color:#4f46e5;">{{actionUrl}}</a>
</p>
