<h1 style="margin:0 0 16px; font-size:22px; line-height:1.3; font-weight:650; letter-spacing:-0.02em; color:#111827;">
  {{title}}
</h1>
<div style="margin:0 0 16px;">
  {{{body}}}
</div>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0 0;">
  <tr>
    <td style="border-radius:8px; background-color:#4f46e5;">
      <a href="{{actionUrl}}" style="display:inline-block; padding:12px 22px; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none;">{{actionLabel}}</a>
    </td>
  </tr>
</table>
