<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{appName}}</title>
    <style>
      /* Inline styles carry the design -- they are the only thing every mail
         client honours. This block exists solely for the two things inline CSS
         cannot express at all.

         Keep it free of double-brace sequences: the template engine substitutes
         this file, so an unrecognised placeholder anywhere in it becomes a
         required variable for every template that uses this layout, and a hard
         error. Class contract: .sm-px .sm-h1 .sm-stack .dm-page .dm-card
         .dm-body are also emitted by the digest cards built in
         supabase/functions/weekly-parent-digest/index.ts. Renaming one here
         means editing that file too. */

      /* Phone widths. `!important` is mandatory -- inline styles otherwise win. */
      @media only screen and (max-width: 600px) {
        .sm-px { padding-left: 20px !important; padding-right: 20px !important; }
        .sm-h1 { font-size: 20px !important; }
        /* The three digest stats share one row of cells. At 320px that is ~90px
           each and the labels wrap to three lines, so stack them instead. */
        .sm-stack { display: block !important; width: 100% !important; padding: 8px 0 !important; }
      }

      /* The color-scheme meta above already opts this mail in to the client's
         dark palette; without explicit colours Gmail and Apple Mail invert the
         white card by guesswork and the indigo wordmark drops below contrast.
         The light chips (grade pills, amber callout) are left alone on purpose
         -- they read as chips either way. */
      @media (prefers-color-scheme: dark) {
        .dm-page { background-color: #16161b !important; }
        .dm-card { background-color: #1e1e25 !important; border-color: #2e2e38 !important; }
        .dm-body, .dm-body p, .dm-body h1, .dm-body h2 { color: #e8e8ee !important; }
      }
    </style>
  </head>
  <body style="margin:0; padding:0; background-color:#f4f4f7; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; color:#1f2333;">
    <table role="presentation" class="dm-page" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f7; padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" class="dm-card" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px; background-color:#ffffff; border-radius:12px; border:1px solid #e4e4ea; overflow:hidden;">
            <tr>
              <td class="sm-px" style="padding:24px 32px; border-bottom:1px solid #eeeef2;">
                <span style="font-size:17px; font-weight:600; letter-spacing:-0.01em; color:#4f46e5;">{{appName}}</span>
              </td>
            </tr>
            <tr>
              <td class="sm-px dm-body" style="padding:32px; font-size:15px; line-height:1.6; color:#1f2333;">
                {{{content}}}
              </td>
            </tr>
            <tr>
              <td class="sm-px" style="padding:20px 32px; background-color:#fafafc; border-top:1px solid #eeeef2; font-size:12px; line-height:1.5; color:#6b7280;">
                <p style="margin:0;">&copy; {{year}} {{appName}}. All rights reserved.</p>
                <p style="margin:6px 0 0;">Questions? Reply to this email or contact <a href="mailto:{{supportEmail}}" style="color:#4f46e5; text-decoration:none;">{{supportEmail}}</a>.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
